[task]
kind = "skillsbench"
split = "v1.1"
root = "../data/skillsbench-v1.1/tasks"

[execution]
kind = "skillsbench"

[execution.options]
command_timeout_seconds = 120

[evaluation]
kind = "skillsbench"

[agent]
kind = "codex"
auth = "chatgpt"
model = "gpt-6-luna"
reasoning_effort = "medium"
timeout_seconds = 900
max_model_calls = 80
max_tool_calls = 100

[run]
episodes = 1
output = "../runs/skillsbench-codex"
