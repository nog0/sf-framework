[task]
kind = "werewolf"
root = "../../self-evolving"
split = "test"
seed = 1

[task.options]
role_preset = "one_wolf"
games = 36
max_days = 6

[execution]
kind = "step"

[evaluation]
kind = "environment"

[agent]
kind = "codex"
auth = "chatgpt"
model = "gpt-6-luna"
reasoning_effort = "medium"
timeout_seconds = 600
max_model_calls = 100
max_tool_calls = 100

[run]
episodes = 1
output = "../runs/werewolf-codex"
