[task]
kind = "spreadsheetbench2"
root = "../data/spreadsheetbench2"
split = "official"

[execution]
kind = "spreadsheetbench2"

[execution.options]
command_timeout_seconds = 90

[evaluation]
kind = "spreadsheetbench2"

[agent]
kind = "codex"
auth = "chatgpt"
model = "gpt-6-luna"
reasoning_effort = "medium"
timeout_seconds = 900
max_model_calls = 80
max_tool_calls = 100

[run]
episodes = 1
output = "../runs/spreadsheetbench2-codex"
