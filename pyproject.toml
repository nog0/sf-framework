[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-framework"
version = "0.1.0"
description = "Extensible task and agent evaluation foundation for self-evolving agents"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version<'3.11'"]

[project.optional-dependencies]
api = ["openai>=1.60,<3"]
alfworld = ["alfworld==0.4.2", "textworld==1.7.0"]
dev = ["pytest>=8,<9", "ruff>=0.9"]
data = ["huggingface-hub>=0.27,<1", "requests>=2.27"]
skillsbench = ["benchflow==0.6.5"]
skillflow = ["harbor==0.25.0"]

[project.scripts]
sf = "sf_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
